name: PHP Tests
on:
  push:
    branches:
      - master
  pull_request:
    branches:
      - master
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    name: PHP ${{ matrix.php }} / ${{ matrix.mysql-version }}

    strategy:
        fail-fast: false
        matrix:
            php: [ '8.2', '8.3', '8.4', '8.5' ]
            mysql-version: [ '5.7', '8.0', '8.4', 'mariadb-10.6', 'mariadb-11.4' ]

    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - uses: shogo82148/actions-setup-mysql@v1
        with:
          mysql-version: "${{ matrix.mysql-version }}"
          my-cnf: |
            server-id=1
            binlog_format=row
            loose-binlog_rows_query_log_events=ON
            loose-binlog_annotate_row_events=ON
            log_bin=binlog
          root-password: root

      - name: set up timezones
        run: mysql_tzinfo_to_sql /usr/share/zoneinfo | mysql -u root mysql -proot

      - name: Setup PHP, with composer and extensions
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          coverage: xdebug

      - name: Validate composer.json and composer.lock
        run: composer validate

      - name: Cache Composer packages
        id: composer-cache
        uses: actions/cache@v4
        with:
          path: vendor
          key: ${{ runner.os }}-${{ matrix.php }}-${{ hashFiles('**/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-${{ matrix.php }}-

      - name: Install dependencies
        if: steps.composer-cache.outputs.cache-hit != 'true'
        run: composer install --prefer-dist --no-progress --no-suggest

      - name: Run tests
        run: vendor/bin/phpunit --coverage-text --testdox

  big-endian-unit-tests:
    runs-on: ubuntu-latest
    name: Unit tests (big-endian / s390x)
    steps:
      - name: Checkout
        uses: actions/checkout@v2

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3
        with:
          platforms: s390x

      - name: Install dependencies
        run: composer install --prefer-dist --no-progress --no-suggest --ignore-platform-reqs

      - name: Run unit tests under emulated big-endian arch
        run: |
          docker run --rm --platform linux/s390x -v "$PWD":/app -w /app php:8.4-cli \
            sh -c 'docker-php-ext-install bcmath >/dev/null && php vendor/bin/phpunit --testsuite "Unit Suite"'
